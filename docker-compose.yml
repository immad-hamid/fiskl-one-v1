# docker-compose.yml
version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoice_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

#   backend:
#     image: yourdockerhub/backend:latest
#     container_name: myapp_backend
#     restart: unless-stopped
#     volumes:
#       - backend_data:/app/data
#     environment:
#       - NODE_ENV=production

#   frontend:
#     image: yourdockerhub/frontend:latest
#     container_name: myapp_frontend
#     restart: unless-stopped
#     ports:
#       - "80:80"
#     depends_on:
#       - backend

# volumes:
#   backend_data:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/invoice_db?schema=public
      DB_HOST: postgres  # Use service name instead of localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: invoice_db
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: /Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - app-network

volumes:
  postgres_data:


networks:
  app-network:
    driver: bridge